spring:
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:niraj.jayswal@knowvasystems.com}
    password: ${SMTP_PASSWORD:SMTP_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  devtools:
    restart:
      enabled: true
      additional-paths: src/main/java,src/main/resources
      poll-interval: 2s
      quiet-period: 1s
    livereload:
      enabled: true
  application:
    name: analyticservice
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/authservice}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

server:
  port: ${SERVER_PORT:8091}
  servlet:
    context-path: ${SERVER_CONTEXT_PATH:/analyticservice}

jwt:
  secret: ${JWT_SECRET:5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437}
  expiration: ${JWT_EXPIRATION:1800000}

management:
  tracing:
    enabled: true
    sampling:
      probability: 1.0
    propagation:
      consume: [w3c, b3]
      produce: [w3c, b3]

logging:
  level:
    root: info
    com.kvs: debug
    com.kvs.core.logging.RequestAndRepositoryLoggingAspect: debug
    org.springframework.security: debug

kvs:
  # Shared WhatsApp/email provider settings (ms-core com.kvs.core.notification). LOG = log only, no message is sent.
  notification:
    whatsapp:
      provider: ${WHATSAPP_PROVIDER:LOG}
      access-token: ${WHATSAPP_ACCESS_TOKEN:REPLACE_WITH_WHATSAPP_ACCESS_TOKEN}
      phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:REPLACE_WITH_PHONE_NUMBER_ID}
      api-version: ${WHATSAPP_API_VERSION:v20.0}
      template-language: ${WHATSAPP_TEMPLATE_LANGUAGE:en}
    email:
      provider: ${EMAIL_PROVIDER:LOG}
      from: ${EMAIL_FROM:REPLACE_WITH_SENDER_EMAIL}
